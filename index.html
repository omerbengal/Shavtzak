<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <!-- <base href="/"> -->

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Viewport for proper mobile scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="shavtzak">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>שבצק - ניהול צוות</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash Screen Styles (inline for instant display) -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
    }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      direction: rtl;
      padding: 20px;
      box-sizing: border-box;
    }

    .splash-icon {
      width: 120px;
      height: 120px;
      background-color: #e3f2fd;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 32px;
    }

    .splash-icon svg {
      width: 60px;
      height: 60px;
      fill: #1e88e5;
    }

    .splash-title {
      font-size: 32px;
      font-weight: bold;
      color: rgba(0, 0, 0, 0.87);
      margin-bottom: 8px;
    }

    .splash-subtitle {
      font-size: 18px;
      color: #9e9e9e;
      margin-bottom: 48px;
    }

    .splash-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e0e0e0;
      border-top-color: #2196f3;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .splash-loading-text {
      font-size: 16px;
      color: #9e9e9e;
    }

    /* Hide splash when Flutter is ready */
    .splash-hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease-out;
    }

    /* Mobile responsive styles */
    @media (max-width: 768px) {
      .splash-icon {
        width: 100px;
        height: 100px;
        border-radius: 16px;
        margin-bottom: 24px;
      }

      .splash-icon svg {
        width: 50px;
        height: 50px;
      }

      .splash-title {
        font-size: 28px;
        margin-bottom: 6px;
      }

      .splash-subtitle {
        font-size: 16px;
        margin-bottom: 36px;
      }

      .splash-spinner {
        width: 32px;
        height: 32px;
        border-width: 2.5px;
        margin-bottom: 14px;
      }

      .splash-loading-text {
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
      .splash-icon {
        width: 80px;
        height: 80px;
        border-radius: 14px;
        margin-bottom: 20px;
      }

      .splash-icon svg {
        width: 40px;
        height: 40px;
      }

      .splash-title {
        font-size: 24px;
        margin-bottom: 4px;
      }

      .splash-subtitle {
        font-size: 14px;
        margin-bottom: 28px;
      }

      .splash-spinner {
        width: 28px;
        height: 28px;
        border-width: 2px;
        margin-bottom: 12px;
      }

      .splash-loading-text {
        font-size: 13px;
      }
    }

    /* Small mobile phones */
    @media (max-width: 360px) {
      .splash-icon {
        width: 70px;
        height: 70px;
      }

      .splash-icon svg {
        width: 35px;
        height: 35px;
      }

      .splash-title {
        font-size: 20px;
      }

      .splash-subtitle {
        font-size: 13px;
      }
    }
  </style>

  <!-- GitHub Pages Hash Routing Fix -->
  <script>
    // Redirect to hash route if no hash is present
    // This ensures GitHub Pages loads the Flutter app correctly
    if (!window.location.hash || window.location.hash === '#' || window.location.hash === '#/') {
      // Check if we're at the base URL (with or without trailing slash)
      const pathname = window.location.pathname;
      if (pathname === '/' || pathname === '/Shavtzak/' || pathname === '/Shavtzak') {
        window.location.replace(window.location.origin + window.location.pathname.replace(/\/$/, '') + '/#/whoami');
      }
    }
  </script>
</head>
<body>
  <!-- Splash Screen (shows immediately) -->
  <div id="splash-screen">
    <div class="splash-icon">
      <!-- Material Icons "group" icon as inline SVG -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
      </svg>
    </div>
    <div class="splash-title">שבצק</div>
    <div class="splash-subtitle">מערכת ניהול צוות</div>
    <div class="splash-spinner"></div>
    <div class="splash-loading-text">טוען...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
