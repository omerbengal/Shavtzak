name: Deploy website

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Kept in step with the SDK the app is actually developed and
          # smoke-tested on. When these drift, a local `flutter build web`
          # stops being a valid check on the release build: 3.27.1 CI vs 3.41.9
          # local turned DropdownButtonFormField's `initialValue` (a post-3.33
          # rename) into a red main. See memory / commit 21c9367.
          flutter-version: '3.41.9'
          channel: 'stable'
      
      - name: Install dependencies
        working-directory: shavtzak
        run: flutter pub get

      - name: Build for web
        working-directory: shavtzak
        run: flutter build web --release --base-href /Shavtzak/ --pwa-strategy=none

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./shavtzak/build/web
