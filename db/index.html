<body>
  <script>
    // Ensure the Flutter hash router enters /db when launched from /db/.
    (function ensureDbHashRoute() {
      const hash = window.location.hash || '';
      if (!hash || hash === '#' || hash === '#/') {
        const target = window.location.pathname + window.location.search + '#/db';
        window.location.replace(target);
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
